# Enhanced Sector Impact Analyzer Configuration
# Simple YAML configuration for all analysis settings

# File paths
files:
  basic_io_file: "iotable/(표)(2020실측)투입산출표_기초가격_기본부문.xlsx"
  employment_file: "iotable/2020지역_부속표_고용표_통합중분류.xlsx"

# Default analysis values
defaults:
  reduction_amount: 1000  # billion won
  target_region: "전지역"
  demand_change: 1000     # billion won

# Analysis options (enable/disable by default)
analysis:
  supply_chain: true
  employment: true
  import_domestic: true
  comprehensive: true

# Display limits
display:
  table_rows: 15
  matrix_rows: 15
  max_sectors_display: 2
  max_sectors_export: 5
  search_results: 20
  steel_sector_name: 30
  coal_sector_name: 40
  excel_sheet_name: 31

# Thresholds
thresholds:
  employment_impact: 0.1     # minimum jobs impact
  economic_magnitude: 1.5    # multiplier for high impact
  employment_significance: 100  # jobs threshold
  import_dependency: 0.5     # share threshold
  fiscal_significance: 0.1   # multiplier for tax impact
  co2_conversion: 1000       # conversion factor

# Sector search keywords
sectors:
  steel_keywords:
    - "철강"
    - "제철"  
    - "선철"
  coal_keywords:
    - "석탄"
    - "코크스"
  coal_matching:
    - "석탄"
    - "코크스"
    - "coal"
    - "coke"

# Interactive menu
menu:
  options:
    - "1. Comprehensive sector analysis"
    - "2. Steel-coal supply chain (comprehensive)"
    - "3. Import vs Domestic impact comparison"
    - "4. Environmental impact analysis"
    - "5. Comprehensive analysis with IO tables"
    - "6. Steel-coal analysis with IO tables"
    - "7. Search sectors"
    - "8. Exit"
  max_choice: 8

# Assessment levels
assessment:
  environmental_concern: "low"